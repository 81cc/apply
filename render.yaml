services:
- type: web
  name: zizifn
  env: docker
  plan: free                 # 或 starter
  region: singapore          # 或 oregon / frankfurt（看你客戶端位置）
  dockerfilePath: ./Dockerfile

  envVars:
  - key: PORT
    value: 8080
  - key: UUID
    generateValue: true      # Render 自動產生 UUID（強烈推薦）

  healthCheckPath: /health
